name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  app:
    name: app (lint, typecheck, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        env:
          SESSION_SECRET: ci-session-secret-32-bytes-minimum-required
          SHARED_PASSWORD: ci-password
        run: pnpm build
